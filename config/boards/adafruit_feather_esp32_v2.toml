# Capability metadata, not an application or a second wiring recipe.
[board]
profile = "adafruit_feather_esp32_v2"
chip = "esp32"
module = "ESP32-PICO-V3-02"
verified_on = "2026-09-15"
sources = ["https://learn.adafruit.com/adafruit-esp32-feather-v2/pinouts", "https://github.com/platformio/platform-espressif32/blob/v6.9.0/boards/adafruit_feather_esp32_v2.json"]
exposed = [4, 5, 7, 8, 12, 13, 14, 15, 19, 20, 21, 22, 25, 26, 27, 32, 33, 34, 36, 37, 39]
onboard = [0, 2, 13, 35, 38]

[runtime]
reserved = [1, 3, 6, 7, 8, 9, 10, 11]
reserved_reason = "Reserved by the current micros ESP32 runtime for serial/flash; this may be stricter than the board hardware."
configurable_pulls = false

[gpio.0]
label = "NeoPixel data"
notes = "Also a boot strapping pin."
[gpio.2]
label = "NeoPixel / STEMMA power"
notes = "Also a boot strapping pin."
[gpio.12]
label = "D12"
notes = "Boot strapping pin; external circuit must preserve the required reset level."
[gpio.13]
label = "D13 / red LED"
[gpio.15]
label = "D15"
notes = "Boot strapping pin."
[gpio.20]
label = "SCL"
notes = "Feather V2 / PICO package pin; not exposed on every ESP32 package."
[gpio.22]
label = "SDA"
[gpio.35]
label = "Battery monitor"
notes = "Connected to a battery-voltage divider."
[gpio.38]
label = "SW38 button"
external_pull = "up"
notes = "Input only; onboard pull-up exists even with internal pull = none."
