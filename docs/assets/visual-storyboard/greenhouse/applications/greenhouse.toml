# Illustrative application design; the referenced service implementations and
# manifests do not yet exist. This is not a deployable hardware example.
# Budgets are placeholders for implementation-specific sizing and validation.
[project]
name = "Greenhouse ventilation"

[services.climate]
manifest = "../services/climate/service.toml"
memory = { arena = "RAM", stack_bytes = 2048 }
publications.reading = { channel = "climate" }

[services.fan]
manifest = "../services/fan/service.toml"
memory = { arena = "RAM", stack_bytes = 2048 }
config = { start_celsius = 28 }
subscriptions.reading = { channel = "climate" }
publications.status = { channel = "fan_status" }

[services.display]
manifest = "../services/display/service.toml"
memory = { arena = "RAM", stack_bytes = 2048 }
subscriptions.reading = { channel = "climate" }
subscriptions.fan = { channel = "fan_status" }

[channels.climate]
key = 1
name = "climate.reading"
interface = "example.greenhouse.climate"
major = 1
minor = 0
accepts_minor = [0, 0]
policy = "latest"
depth = 1
max_payload = 64
schema = "../schemas/climate.proto"

[channels.fan_status]
key = 2
name = "fan.status"
interface = "example.greenhouse.fan"
major = 1
minor = 0
accepts_minor = [0, 0]
policy = "latest"
depth = 1
max_payload = 64
schema = "../schemas/fan.proto"
