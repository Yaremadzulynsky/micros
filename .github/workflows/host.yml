name: Host regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - run: ./micros setup
      - run: cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPython3_EXECUTABLE="$PWD/build/python/bin/python"
      - run: cmake --build build/host --parallel 3
      - run: ctest --test-dir build/host --output-on-failure --timeout 120 --no-tests=error
      - name: New application without operator state
        run: |
          export MICROS_CLIENT_DIR="$RUNNER_TEMP/micros-client"
          export MICROS_STATE_DIR="$RUNNER_TEMP/micros-state"
          ./micros new "$RUNNER_TEMP/first-app"
          cd "$RUNNER_TEMP/first-app"
          export MICROS_SDK="$GITHUB_WORKSPACE"
          ./micros generate
          test ! -d units
          ./micros test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-results-${{ matrix.os }}
          path: build/host/Testing/Temporary/
