services:
  management:
    build:
      context: ../..
      dockerfile: src/server/Dockerfile
    ports:
      - "${MICROS_SERVER_BIND:-0.0.0.0}:${MICROS_SERVER_PORT:-8443}:8443"
    volumes:
      - "${MICROS_SERVER_STATE:?Set MICROS_SERVER_STATE to the private server state directory}:/state"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
