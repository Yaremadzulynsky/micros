[project]
name = "Network bridge"

# Keep the alias 'bridge': it names the generated bindings used by the service.
[services.bridge]
source = "../../services/network-bridge"
name = "board.network-bridge"
version = "1.0.0"
enabled = true
memory = { arena = "RAM", stack_bytes = 2048 }
[services.bridge.build]
sources = ["src/service.c"]
defines = []
descriptor = "micros_descriptor"
[services.bridge.capabilities]
gpio = []
timers = 0
# Publications receive network messages; subscriptions supply network reads.
# Add/remove ports freely. Use separate channels to avoid forwarding loops.
[services.bridge.publications.inbound]
channel = "incoming"
[services.bridge.subscriptions.outbound]
channel = "outgoing"

[channels.incoming]
key = 1
name = "bridge.incoming"
interface = "micros.button.state"
major = 1
minor = 1
accepts_minor = [1, 1]
policy = "stream"
depth = 8
max_payload = 64
schema = "../../src/sdk/protos/button/v1/button_state.proto"

[channels.outgoing]
key = 2
name = "bridge.outgoing"
interface = "micros.button.state"
major = 1
minor = 1
accepts_minor = [1, 1]
policy = "stream"
depth = 8
max_payload = 64
schema = "../../src/sdk/protos/button/v1/button_state.proto"
