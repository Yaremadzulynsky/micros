[project]
name = "Interactive service command example"
[board]
profile = "adafruit_feather_esp32_v2"
flash_mb = 8

[services.demo]
source = "."
contract = "service.toml"
memory = { arena = "RAM", stack_bytes = 2048 }
subscriptions.set = { channel = "set" }
publications.status = { channel = "status" }

[services.bridge]
source = "../../services/network-bridge"
name = "board.network-bridge"
version = "1.1.0"
memory = { arena = "RAM", stack_bytes = 2048 }
build = { sources = ["src/service.c"], defines = [], descriptor = "micros_descriptor" }
capabilities = { gpio = [], timers = 0 }
publications.set = { channel = "set" }
subscriptions.status = { channel = "status" }

[channels.set]
key = 1
name = "example.set"
interface = "micros.example.shell.set"
major = 1
minor = 0
accepts_minor = [0, 0]
policy = "stream"
depth = 8
max_payload = 16
schema = "protos/set_value.proto"

[channels.status]
key = 2
name = "example.status"
interface = "micros.example.shell.status"
major = 1
minor = 0
accepts_minor = [0, 0]
policy = "latest"
depth = 1
max_payload = 64
schema = "protos/value_status.proto"
