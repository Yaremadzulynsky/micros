[service]
name = "example.shell"
version = "1.0.0"
[service.build]
api = "shell_demo"
sources = ["src/service.c"]
defines = []
descriptor = "micros_descriptor"
[service.capabilities]
gpio = []
timers = 0
[service.config_schema]
[service.subscriptions.set]
interface = "micros.example.shell.set"
major = 1
minor = 0
accepts_minor = [0, 0]
policy = "stream"
depth = 8
max_payload = 16
schema = "protos/set_value.proto"
[service.publications.status]
interface = "micros.example.shell.status"
major = 1
minor = 0
accepts_minor = [0, 0]
policy = "latest"
depth = 1
max_payload = 64
schema = "protos/value_status.proto"
