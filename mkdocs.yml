site_name: Micros Docs
site_description: Service-oriented development and management for microcontrollers.
site_url: https://docs.meetmicros.com/
repo_url: https://github.com/Yaremadzulynsky/micros
repo_name: Yaremadzulynsky/micros
edit_uri: edit/main/docs/
site_dir: build/docs-site
theme:
  name: material
  font: false
  palette:
    scheme: default
    primary: black
    accent: teal
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - content.code.copy
plugins:
  - search
hooks:
  - tools/docs/hooks.py
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences
  - toc:
      permalink: true
extra_css:
  - stylesheets/micros.css
  - stylesheets/storyboard.css
extra_javascript:
  - javascripts/storyboard-loader.js
exclude_docs: |
  /planning/
  /archive/
validation:
  nav:
    omitted_files: ignore
  links:
    not_found: warn
    anchors: info
nav:
  - Start:
      - Home: index.md
      - Quickstart: site/get-started.md
      - Architecture: site/architecture.md
      - Set up a board: site/set-up-an-esp32.md
      - Server and console: site/run-management-server.md
  - Build:
      - Write a service: site/write-a-service.md
      - Connect services: site/connect-service-ports.md
      - Service commands: site/service-commands.md
      - Service channels: site/inspect-service-channels.md
  - Use:
      - Deploy and update: site/deploy-an-application.md
      - Interactive shell: site/interactive-shell.md
  - Reference:
      - CLI: site/cli.md
      - Configuration:
          - Which file to edit: site/declaration-authoring.md
          - Service definitions: site/service-configuration.md
          - Unit files: site/unit-configuration.md
          - Shared interfaces: site/interface-configuration.md
      - Service API: site/service-api.md
      - Coordination: site/coordination-reference.md
      - Contributing: site/contributing.md
  - Micros website: https://meetmicros.com/
