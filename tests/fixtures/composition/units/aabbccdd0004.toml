# Offline fixture with synthetic device IDs; never an operator deployment.
[unit]
device_id = "aabbccdd0004"
[project]
name = "Device-independent coordination controller"
[board]
profile = "esp8266_4mb"
[services.controller]
source = "../../../../examples/services/coordination-controller"
name = "coordination.controller"
version = "1.2.0"
enabled = true
memory = { arena = "RAM", stack_bytes = 2048 }
[services.controller.build]
sources = ["src/service.c"]
descriptor = "micros_descriptor"
[services.controller.capabilities]
gpio = []
timers = 1
[services.controller.publications.target]
channel = "target"
kind = "state"
[services.controller.publications.operation]
channel = "operation"
kind = "action"
[channels.target]
key = 2
name = "coord.target"
interface = "micros.coordination.target"
major = 1
minor = 0
accepts_minor = [0, 0]
policy = "latest"
depth = 1
max_payload = 16
schema = "../../../../src/sdk/protos/coordination/v1/target.proto"
[channels.operation]
key = 1
name = "ir.actions"
interface = "micros.coordination.ir.action"
major = 1
minor = 0
accepts_minor = [0, 0]
policy = "latest"
depth = 1
max_payload = 32
schema = "../../../../src/sdk/protos/coordination/v1/ir_action.proto"
