# Offline fixture with synthetic device IDs; never an operator deployment.
# Application services and local channels. Hardware and network connections belong in the deployment.

[project]
disabled_sdkconfig = ["CONFIG_PM_ENABLE"]
name = "hello-world"

[project.required_sdkconfig]
CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ = "160"

[services.hello]
manifest = "../../../../examples/hello-service/service.toml"
memory = { arena = "RAM", stack_bytes = 4096 }




[services.dht]
manifest = "../../../../examples/services/dht/service.toml"
memory = { arena = "RAM", stack_bytes = 4096 }



[services.dht.publications.environment]
channel = "environment"

[services.controller]
manifest = "../../../../examples/services/coordination-controller/service.toml"
memory = { arena = "RAM", stack_bytes = 2048 }

[services.controller.publications.target]
channel = "target"
kind = "state"

[services.controller.publications.operation]
channel = "operation"
kind = "action"

[channels.environment]
accepts_minor = [0, 0]
depth = 1
interface = "micros.environment.reading"
key = 2
major = 1
max_payload = 64
minor = 0
name = "environment.reading"
policy = "latest"
schema = "../../../../src/sdk/protos/environment/v1/environment_reading.proto"

[channels.target]
key = 3
name = "coord.target"
interface = "micros.coordination.target"
major = 1
minor = 0
accepts_minor = [0, 0]
policy = "latest"
depth = 1
max_payload = 16
schema = "../../../../src/sdk/protos/coordination/v1/target.proto"

[channels.operation]
key = 1
name = "ir.actions"
interface = "micros.coordination.ir.action"
major = 1
minor = 0
accepts_minor = [0, 0]
policy = "latest"
depth = 1
max_payload = 32
schema = "../../../../src/sdk/protos/coordination/v1/ir_action.proto"
