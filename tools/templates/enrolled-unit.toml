# Starter configuration for a detected board. Enrollment supplies its identity.
[project]
name = "My board application"

[board]
profile = "esp32_d0wd_v3_no_controls"
flash_mb = 4
recovery_button = ""

[services.hello]
source = "../services/hello"
contract = "service.toml"
memory = { arena = "RAM", stack_bytes = 4096 }
config = { interval_ms = 1000 }
