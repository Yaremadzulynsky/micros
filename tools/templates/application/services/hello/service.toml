# Working hello service + reference for current service declaration options.
# Only hello's required options are active. Uncomment the sections you need,
# implement their hooks, then run ./micros generate and ./micros compose.
# Behavior and setting constraints belong here; values, pin assignments, memory
# budgets, channel wiring and command exposure belong in units/<target>.toml.
# Reference: https://docs.meetmicros.com/site/declaration-authoring/

[service]
name = "example.hello"
version = "1.1.0"
# Named timers reserve handles; code chooses the delay, period and callback.
timers = ["greeting"]
# Alternative to the inline [service.types.*] examples below: create a local
# types.toml with [types.Count], etc. Do not use both forms together.
# types = "types.toml"

[service.build]
api = "hello"                         # Prefix for generated C names.
lifecycle = "hooks"                   # Micros generates lifecycle/resource cleanup.
sources = ["src/service.c"]           # Add other .c/.cpp files to this list.
descriptor = "micros_descriptor"      # Exported descriptor symbol.
# defines = ["HELLO_VERBOSE=1"]        # Compiler definitions, without -D.
# For a hand-written ABI implementation, REPLACE lifecycle above with:
# lifecycle = "manual"

# Startup settings: uint32 or enum only, including named types of those kinds.
# Units choose config = { interval_ms = 250 }; omitted values use these defaults.
[service.config_schema.interval_ms]
type = "uint32"
default = 1000
min = 100
max = 60000

# Optional enum setting. Enum choice order is its numeric identity.
# [service.config_schema.mode]
# type = "enum"
# choices = ["quiet", "normal", "verbose"]
# default = "normal"

# Optional setting using Count from the named types below.
# [service.config_schema.initial_count]
# type = "Count"
# default = 0

# Reusable types: all five supported value kinds, with their available constraints.
# uint32/enum can be settings or command fields; sint32/bool/string are command
# fields only. Names use UpperCamelCase. References reuse the type's bounds.
# [service.types.Count]
# type = "uint32"
# min = 0
# max = 1000

# [service.types.Offset]
# type = "sint32"
# min = -100
# max = 100

# [service.types.Enabled]
# type = "bool"

# [service.types.Label]
# type = "string"
# max_bytes = 32                       # Required; 1..64 UTF-8 bytes.

# [service.types.Mode]
# type = "enum"
# choices = ["quiet", "normal", "verbose"]

# GPIO roles: all supported pin types. Enable only roles your code uses.
# A board unit assigns numbers: pins = { led = 2 }. Host units cannot use GPIO.
# Pull and analog support depend on the target and actual wiring.
# [service.pins.led]
# type = "output"
# fixed_pin = 2                        # Optional driver constraint, not a default.

# [service.pins.button]
# type = "input"

# [service.pins.button_up]
# type = "pullup"

# [service.pins.button_down]
# type = "pulldown"

# [service.pins.sensor]
# type = "analog"

# Receive/send typed messages. Create the referenced shared interface.toml and
# protobuf schema first; it owns delivery policy and payload shape. Each enabled
# port also needs a same-name [channels.NAME] table in the unit.
# https://docs.meetmicros.com/site/connect-service-ports/
# [service.subscriptions.reading]
# interface = "../../protos/reading/interface.toml"
# min_depth = 1                       # Optional minimum queue depth, 1..8.

# [service.publications.greeting_events]
# interface = "../../protos/greeting_events/interface.toml"
# min_depth = 4                       # Requires stream policy; latest needs 1.

# Commands: implement the generated handlers and explicitly select remote access
# in the unit: expose_commands = ["set_count", "configure", "reset"].
# args and returns are maps with at most 8 fields each; either may be empty.
# Field declarations accept a built-in type, a named type, or an inline type table.
# https://docs.meetmicros.com/site/service-commands/
# [service.commands.set_count]
# description = "Set the counter value"  # Optional help text, 1..80 characters.
# args = { value = "Count" }
# returns = { value = "Count" }

# [service.commands.configure]
# description = "Apply command parameters"
# args = { offset = "Offset", enabled = "Enabled", label = "Label", mode = "Mode" }
# returns = { accepted = "bool", applied = { type = "uint32", min = 0, max = 1000 } }

# [service.commands.reset]
# description = "Reset the counter"
# args = {}
# returns = {}

# Advanced manual ABI resource declarations. Usually leave these out: Micros
# derives GPIO capabilities from pins, timer counts from named timers, and handle
# counts from all declared resources. Never declare a handles count yourself.
# To use an unnamed timer pool, remove the named timers above first and provide
# your own timer open/close behavior (normally with lifecycle = "manual").
# gpio, when specified, must list every declared pin role exactly once.
# [service.capabilities]
# timers = 1
# gpio = ["led", "button", "button_up", "button_down", "sensor"]

# After enabling commands/ports, inspect the additional hook signatures with:
# ./micros scaffold-service services/hello --preview
# Generation does not implement behavior or overwrite src/service.c.
